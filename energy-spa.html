<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СТ Птичь — Учёт электроэнергии</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f0;color:#1b5e20;min-height:100vh}
.nav{background:white;padding:0.6rem;display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;border-bottom:2px solid #c8e6c9;position:sticky;top:0;z-index:100}
        .nav button{background:none;border:2px solid #eab308;padding:0.5rem 1rem;border-radius:40px;cursor:pointer;font-size:0.85rem;transition:all 0.2s;color:#2e7d32}
        .nav button:hover{background:#fef9c3}
        .nav button.active{background:linear-gradient(135deg,#eab308,#ca8a04);color:#1a1a1a;border-color:#ca8a04;font-weight:700;box-shadow:0 2px 8px rgba(234,179,8,0.4)}
        .user-info{margin-left:auto;background:#e8f5e9;padding:0.3rem 1rem;border-radius:40px;display:flex;align-items:center;gap:0.6rem;font-size:0.85rem}
        .logout-btn{background:#c62828;color:white;border:none;padding:0.3rem 0.9rem;border-radius:20px;cursor:pointer;font-size:0.8rem}
        .container{max-width:1200px;margin:1.2rem auto;padding:0 1rem}
        .card{background:white;border-radius:16px;padding:1.5rem;margin-bottom:1.2rem;border:1px solid #c8e6c9;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .card h2{color:#2e7d32;margin-bottom:1rem;font-size:1.2rem}
        table{width:100%;border-collapse:collapse;margin:0.8rem 0;font-size:0.85rem}
        th,td{text-align:left;padding:0.6rem;border-bottom:1px solid #e0e0e0}
        th{background:#f1f8e9;font-weight:600;color:#2e7d32}
        .form-group{margin-bottom:1rem}
        label{display:block;margin-bottom:0.3rem;font-weight:500;font-size:0.9rem}
        input,select{width:100%;padding:0.7rem;border:1px solid #c8e6c9;border-radius:12px;font-size:0.9rem}
        input:focus,select:focus{outline:none;border-color:#2e7d32}
        button.primary{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:white;border:none;padding:0.7rem 1.2rem;border-radius:40px;cursor:pointer;font-size:0.9rem}
        .debt{color:#c62828;font-weight:bold}
        .overpay{color:#2e7d32;font-weight:bold}
        .msg{padding:0.8rem;border-radius:8px;margin-top:0.5rem}
        .msg-error{color:#c62828;background:#ffebee}
        .msg-success{color:#2e7d32;background:#e8f5e9}
        .info{color:#555;font-size:0.85rem;margin-top:0.5rem}
        .badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.75rem;font-weight:600}
        .badge-admin{background:#fff3e0;color:#e65100}
        .badge-user{background:#e8f5e9;color:#2e7d32}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
        .stat{background:#f1f8e9;padding:1rem;border-radius:12px;text-align:center}
        .stat-v{font-size:1.5rem;font-weight:700;color:#2e7d32}
        .stat-l{font-size:0.8rem;color:#666;margin-top:0.3rem}
        .spin{display:inline-block;width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#2e7d32;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:768px){.nav{overflow-x:auto;flex-wrap:nowrap}.stats{grid-template-columns:1fr 1fr}.user-info{display:none}}
    
        .page-header{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;padding:1.2rem 1rem;text-align:center;position:relative}
        .page-header h1{font-size:1.4rem;font-weight:700;margin:0;text-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .page-header .back-link{display:inline-block;margin-top:0.6rem;color:#fde047;font-size:0.9rem;text-decoration:none;font-weight:500;transition:all 0.2s}
        .page-header .back-link:hover{color:#fff;text-decoration:underline}
        .page-header .back-link::before{content:'← ';}
</style>
</head>
<body>
<div id="app"></div>
<script>
    const API_URL='https://script.google.com/macros/s/AKfycbz08kfZ77NISg53DKaNIU9MttuFJy7kMXU0fHEQe66WcI1RdzSxzb6PIIcVYb4eG99_Cw/exec';
    const TARIFF=0.3341;
    let members=[],readings=[],payments=[],currentUser=null,currentPage='dashboard';

    async function api(action,params={}){
        const u=new URL(API_URL);
        u.searchParams.append('action',action);
        Object.keys(params).forEach(k=>u.searchParams.append(k,params[k]));
        try{const r=await fetch(u.toString());return await r.json();}
        catch(e){return{success:false,error:e.message};}
    }

    async function load(){
        showLoading();
        const[mr,rr,pr]=await Promise.all([api('getMembers'),api('getReadings'),api('getPayments')]);
        if(mr.success)members=mr.data;
        if(rr.success)readings=rr.data;
        if(pr.success)payments=pr.data;
    }

    function getMember(id){return members.find(m=>parseInt(m.id)===id);}

    function getLastReading(mid){
        const mr=readings.filter(r=>parseInt(r.memberId)===mid);
        if(!mr.length)return null;
        return mr.reduce((l,c)=>new Date(c.date)>new Date(l.date)?c:l);
    }

    function calcBalance(mid){
        const last=getLastReading(mid);
        if(!last)return{cons:0,accrued:0,paid:0,bal:0,hasData:false};
        const cons=parseInt(last.value)-parseInt(last.prevValue);
        const accrued=cons*TARIFF;
        const paid=payments.filter(p=>parseInt(p.memberId)===mid).reduce((s,p)=>s+parseFloat(p.amount),0);
        return{cons,accrued,paid,bal:paid-accrued,hasData:true,date:last.date};
    }

    function fmtDate(d){return d?new Date(d).toLocaleDateString('ru-RU'):'—';}
    function fmtMoney(v){return parseFloat(v).toFixed(2)+' руб';}

    function showLoading(){
        const r=document.getElementById('app-root');
        if(r)r.innerHTML='<div class="card" style="text-align:center;padding:3rem"><div class="spin"></div><p style="margin-top:1rem;color:#666">Загрузка...</p></div>';
    }

    function renderLogin(){
        return '<div class="container"><div class="card" style="max-width:400px;margin:2rem auto">'+
        '<h2>🔐 Вход</h2><form id="loginForm">'+
        '<div class="form-group"><label>Номер участка</label><input type="text" id="loginPlot" placeholder="Например: 15" required></div>'+
        '<div class="form-group"><label>Пароль</label><div style="display:flex;gap:8px;align-items:center"><input type="password" id="loginPassword" required style="flex:1"><button type="button" id="togglePwd" style="background:#e8f5e9;border:1px solid #c8e6c9;padding:0.5rem 0.8rem;border-radius:12px;cursor:pointer;font-size:0.85rem;color:#2e7d32">👁 Показать</button></div></div>'+
        '<button type="submit" class="primary">Войти</button></form>'+
        '<div id="loginError" class="msg msg-error" style="display:none"></div>'+
        '<div class="info"><p>🔑 Участники: пароль = номер участка</p><p>👑 Председатель: 0 / admin123</p><p>📊 Бухгалтер: 00 / buh123</p></div>'+
        '</div></div>';
    }

    function renderNav(){
        const isAdmin=currentUser.role==='admin';
        const pages=isAdmin?
            [{id:'dashboard',i:'📊',l:'Сводка'},{id:'readings',i:'📟',l:'Показания'},{id:'payments',i:'💰',l:'Оплаты'},{id:'addpay',i:'➕',l:'Внести оплату'},{id:'users',i:'👥',l:'Участки'},{id:'profile',i:'⚙️',l:'Профиль'}]:
            [{id:'dashboard',i:'📊',l:'Баланс'},{id:'readings',i:'📟',l:'Показания'},{id:'payments',i:'💰',l:'Мои оплаты'},{id:'profile',i:'⚙️',l:'Профиль'}];
        const btns=pages.map(p=>'<button data-page="'+p.id+'" class="'+(currentPage===p.id?'active':'')+'">'+p.i+' '+p.l+'</button>').join('');
        return '<div class="page-header"><h1>⚡ Учёт электроэнергии</h1><a href="https://otoipi6-del.github.io/st-ptich/tarify.html" class="back-link" target="_self">Вернуться к Тарифы</a></div>'+
        '<div class="nav">'+btns+'<div class="user-info"><span class="badge badge-'+(isAdmin?'admin':'user')+'">'+(isAdmin?'👑':'🧑')+'</span>'+currentUser.plot+' — '+currentUser.name+'<button id="logoutBtn" class="logout-btn">Выйти</button></div></div>'+
        '<div class="container" id="app-root"></div>';
    }

    function renderDashboard(){
        if(currentUser.role==='admin'){
            let rows='',totalDebt=0,totalAccrued=0,totalPaid=0;
            const um=members.filter(m=>m.role==='user');
            for(const m of um){
                const b=calcBalance(parseInt(m.id));
                const last=getLastReading(parseInt(m.id));
                if(!b.hasData)continue;
                totalAccrued+=b.accrued;totalPaid+=b.paid;
                if(b.bal>0)totalDebt+=b.bal;
                rows+='<tr><td>'+m.plot+'</td><td>'+m.name+'</td><td>'+(last?last.value:'—')+'</td><td>'+b.cons+'</td><td>'+fmtMoney(b.accrued)+'</td><td>'+fmtMoney(b.paid)+'</td><td class="'+(b.bal>0?'overpay':b.bal<0?'debt':'')+'">'+fmtMoney(b.bal)+'</td></tr>';
            }
            return '<div class="stats">'+
            '<div class="stat"><div class="stat-v">'+um.length+'</div><div class="stat-l">Участков</div></div>'+
            '<div class="stat"><div class="stat-v" style="color:#c62828">'+fmtMoney(totalDebt)+'</div><div class="stat-l">Долг</div></div>'+
            '<div class="stat"><div class="stat-v">'+fmtMoney(totalAccrued)+'</div><div class="stat-l">Начислено</div></div>'+
            '<div class="stat"><div class="stat-v">'+fmtMoney(totalPaid)+'</div><div class="stat-l">Оплачено</div></div>'+
            '</div><div class="card"><h2>📋 Сводка</h2><div style="overflow-x:auto"><table><thead><tr><th>Участок</th><th>Владелец</th><th>Показания</th><th>Расход</th><th>Начислено</th><th>Оплачено</th><th>Сальдо</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
        }else{
            const b=calcBalance(currentUser.id);
            const last=getLastReading(currentUser.id);
            if(!b.hasData)return'<div class="card"><h2>📊 Ваш баланс</h2><p>Нет показаний. Передайте в разделе «Показания».</p></div>';
            return'<div class="card"><h2>📊 Ваш баланс</h2><table>'+
            '<tr><th>Участок</th><td>'+currentUser.plot+'</td></tr>'+
            '<tr><th>Владелец</th><td>'+currentUser.name+'</td></tr>'+
            '<tr><th>Текущие показания</th><td>'+(last?last.value:'—')+' кВт·ч ('+fmtDate(last?last.date:null)+')</td></tr>'+
            '<tr><th>Расход</th><td>'+b.cons+' кВт·ч</td></tr>'+
            '<tr><th>Начислено</th><td>'+fmtMoney(b.accrued)+'</td></tr>'+
            '<tr><th>Оплачено</th><td>'+fmtMoney(b.paid)+'</td></tr>'+
            '<tr><th>Сальдо</th><td class="'+(b.bal>0?'overpay':b.bal<0?'debt':'')+'">'+fmtMoney(b.bal)+'</td></tr>'+
            '</table></div>';
        }
    }

    function renderReadings(){
        if(currentUser.role==='admin'){
            let rows='';
            const sr=[...readings].sort((a,b)=>new Date(b.date)-new Date(a.date));
            for(const r of sr){
                const m=getMember(parseInt(r.memberId));
                if(m&&m.role==='user'){
                    const cons=parseInt(r.value)-parseInt(r.prevValue);
                    rows+='<tr><td>'+m.plot+'</td><td>'+m.name+'</td><td>'+fmtDate(r.date)+'</td><td>'+r.value+'</td><td>'+r.prevValue+'</td><td>'+cons+'</td></tr>';
                }
            }
            return'<div class="card"><h2>📟 Все показания</h2><div style="overflow-x:auto"><table><thead><tr><th>Участок</th><th>Владелец</th><th>Дата</th><th>Текущие</th><th>Предыдущие</th><th>Расход</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
        }else{
            const last=getLastReading(currentUser.id);
            return'<div class="card"><h2>📟 Передать показания</h2>'+
            '<div class="info"><p>Последние показания: <strong>'+(last?last.value:'—')+' кВт·ч</strong> ('+fmtDate(last?last.date:null)+')</p><p>Тариф: <strong>'+TARIFF+' руб/кВт·ч</strong></p></div>'+
            '<form id="readingForm"><div class="form-group"><label>Текущие показания (кВт·ч)</label><input type="number" id="readValue" step="1" min="'+(last?parseInt(last.value):0)+'" required placeholder="Введите новые показания"></div>'+
            '<div class="form-group"><label>Дата съёма</label><input type="date" id="readDate" value="'+new Date().toISOString().slice(0,10)+'" required></div>'+
            '<button type="submit" class="primary">Отправить показания</button></form>'+
            '<div id="readMsg"></div></div>';
        }
    }

    function renderPayments(){
        if(currentUser.role==='admin'){
            let rows='';
            const sp=[...payments].sort((a,b)=>new Date(b.date)-new Date(a.date));
            for(const p of sp){
                const m=getMember(parseInt(p.memberId));
                if(m&&m.role==='user')rows+='<tr><td>'+m.plot+'</td><td>'+m.name+'</td><td>'+fmtDate(p.date)+'</td><td>'+fmtMoney(p.amount)+'</td></tr>';
            }
            return'<div class="card"><h2>💰 Все оплаты</h2><div style="overflow-x:auto"><table><thead><tr><th>Участок</th><th>Владелец</th><th>Дата</th><th>Сумма</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
        }else{
            const up=payments.filter(p=>parseInt(p.memberId)===currentUser.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
            if(!up.length)return'<div class="card"><h2>💰 Ваши оплаты</h2><p>Нет оплат.</p></div>';
            let rows=up.map(p=>'<tr><td>'+fmtDate(p.date)+'</td><td>'+fmtMoney(p.amount)+'</td></tr>').join('');
            const total=up.reduce((s,p)=>s+parseFloat(p.amount),0);
            return'<div class="card"><h2>💰 Ваши оплаты</h2><table><thead><tr><th>Дата</th><th>Сумма</th></tr></thead><tbody>'+rows+'</tbody></table><p style="margin-top:1rem;font-weight:600">Всего оплачено: <span class="overpay">'+fmtMoney(total)+'</span></p></div>';
        }
    }

    function renderAddPay(){
        const opts=members.filter(m=>m.role==='user').map(m=>'<option value="'+m.id+'">'+m.plot+' — '+m.name+'</option>').join('');
        return'<div class="card"><h2>➕ Внести оплату</h2><form id="payForm">'+
        '<div class="form-group"><label>Участок</label><select id="payMemberId">'+opts+'</select></div>'+
        '<div class="form-group"><label>Сумма (руб)</label><input type="number" id="payAmount" step="0.01" min="0.01" required placeholder="0.00"></div>'+
        '<div class="form-group"><label>Дата</label><input type="date" id="payDate" value="'+new Date().toISOString().slice(0,10)+'" required></div>'+
        '<button type="submit" class="primary">Записать оплату</button></form><div id="payMsg"></div></div>';
    }

    function renderUsers(){
        let rows='';
        for(const m of members.filter(m=>m.role==='user')){
            const b=calcBalance(parseInt(m.id));
            rows+='<tr><td>'+m.plot+'</td><td>'+m.name+'</td><td>'+(b.hasData?fmtMoney(b.bal):'—')+'</td><td><input type="text" id="pwd-'+m.id+'" value="'+m.password+'" placeholder="новый пароль" style="width:120px"></td><td><button class="primary" style="padding:0.4rem 0.8rem;font-size:0.8rem" onclick="changePwd('+m.id+')">Сменить</button></td></tr>';
        }
        return'<div class="card"><h2>👥 Участки</h2><div style="overflow-x:auto"><table><thead><tr><th>Участок</th><th>Владелец</th><th>Сальдо</th><th>Пароль</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><div id="userMsg"></div></div>';
    }

    function renderProfile(){
        return'<div class="card"><h2>⚙️ Профиль</h2><form id="pwdForm">'+
        '<div class="form-group"><label>Новый пароль</label><input type="text" id="newPwd" required placeholder="Введите новый пароль"></div>'+
        '<button type="submit" class="primary">Сменить пароль</button></form><div id="pwdMsg"></div>'+
        '<hr style="margin:1.5rem 0;border:none;border-top:1px solid #e0e0e0">'+
        '<div class="info"><p><strong>Участок:</strong> '+currentUser.plot+'</p><p><strong>Имя:</strong> '+currentUser.name+'</p><p><strong>Роль:</strong> '+(currentUser.role==='admin'?'Администратор':'Участник')+'</p><p><strong>Тариф:</strong> '+TARIFF+' руб/кВт·ч</p></div></div>';
    }

    window.changePwd=async function(id){
        try{
            const el=document.getElementById('pwd-'+id);
            if(!el){alert('Поле ввода не найдено');return;}
            const np=el.value.trim();
            if(!np){alert('Введите новый пароль');return;}
            const mid=parseInt(id)||id;
            const res=await api('updatePassword',{memberId:mid,newPassword:np});
            const msg=document.getElementById('userMsg');
            msg.innerHTML='<div class="msg '+(res.success?'msg-success':'msg-error')+'">'+(res.success?'✅ Пароль участка изменён':'❌ Ошибка: '+(res.error||'неизвестная ошибка'))+'</div>';
            if(res.success){await load();}
            setTimeout(()=>msg.innerHTML='',3000);
        }catch(err){
            alert('Ошибка при смене пароля: '+err.message);
        }
    };

    async function attach(){
        const rf=document.getElementById('readingForm');
        if(rf){
            rf.onsubmit=async(e)=>{
                e.preventDefault();
                try{
                    const val=parseFloat(document.getElementById('readValue').value);
                    const date=document.getElementById('readDate').value;
                    if(isNaN(val)||val<0){document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Введите корректное значение показаний</div>';setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);return;}
                    if(!date){document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Укажите дату съёма</div>';setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);return;}
                    const last=getLastReading(currentUser.id);
                    const prev=last?parseInt(last.value):0;
                    if(val<=prev){document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Новые показания должны быть больше предыдущих ('+prev+')</div>';setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);return;}
                    const res=await api('addReading',{memberId:currentUser.id,date,value:val,prevValue:prev});
                    if(!res){document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Нет ответа от сервера</div>';setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);return;}
                    if(res.success){await load();document.getElementById('readMsg').innerHTML='<div class="msg msg-success">✅ Показания приняты: '+val+' кВт·ч</div>';rf.reset();document.getElementById('readDate').value=new Date().toISOString().slice(0,10);setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);}
                    else{document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Ошибка сервера: '+(res.error||'неизвестная ошибка')+'</div>';setTimeout(()=>document.getElementById('readMsg').innerHTML='',3000);}
                }catch(err){
                    document.getElementById('readMsg').innerHTML='<div class="msg msg-error">❌ Ошибка: '+err.message+'</div>';
                    setTimeout(()=>document.getElementById('readMsg').innerHTML='',5000);
                }
            };
        }
        const pf=document.getElementById('pwdForm');
        if(pf){
            pf.onsubmit=async(e)=>{
                e.preventDefault();
                const np=document.getElementById('newPwd').value.trim();
                if(!np)return;
                const res=await api('updatePassword',{memberId:currentUser.id,newPassword:np});
                document.getElementById('pwdMsg').innerHTML='<div class="msg '+(res.success?'msg-success':'msg-error')+'">'+(res.success?'✅ Пароль изменён':'❌ Ошибка')+'</div>';
                if(res.success){currentUser.password=np;await load();pf.reset();}
                setTimeout(()=>document.getElementById('pwdMsg').innerHTML='',3000);
            };
        }
        const payf=document.getElementById('payForm');
        if(payf){
            payf.onsubmit=async(e)=>{
                e.preventDefault();
                try{
                    const mid=parseInt(document.getElementById('payMemberId').value);
                    const amt=parseFloat(document.getElementById('payAmount').value);
                    const date=document.getElementById('payDate').value;
                    if(!mid||isNaN(mid)||mid<=0){document.getElementById('payMsg').innerHTML='<div class="msg msg-error">❌ Выберите участок</div>';setTimeout(()=>document.getElementById('payMsg').innerHTML='',3000);return;}
                    if(!date){document.getElementById('payMsg').innerHTML='<div class="msg msg-error">❌ Укажите дату</div>';setTimeout(()=>document.getElementById('payMsg').innerHTML='',3000);return;}
                    if(isNaN(amt)||amt<=0){document.getElementById('payMsg').innerHTML='<div class="msg msg-error">❌ Укажите корректную сумму</div>';setTimeout(()=>document.getElementById('payMsg').innerHTML='',3000);return;}
                    const res=await api('addPayment',{memberId:mid,date,amount:amt});
                    if(!res){document.getElementById('payMsg').innerHTML='<div class="msg msg-error">❌ Нет ответа от сервера</div>';setTimeout(()=>document.getElementById('payMsg').innerHTML='',3000);return;}
                    document.getElementById('payMsg').innerHTML='<div class="msg '+(res.success?'msg-success':'msg-error')+'">'+(res.success?'✅ Оплата '+fmtMoney(amt)+' добавлена':'❌ Ошибка: '+(res.error||'неизвестная ошибка'))+'</div>';
                    if(res.success){await load();payf.reset();document.getElementById('payDate').value=new Date().toISOString().slice(0,10);}
                    setTimeout(()=>document.getElementById('payMsg').innerHTML='',3000);
                }catch(err){
                    document.getElementById('payMsg').innerHTML='<div class="msg msg-error">❌ Ошибка: '+err.message+'</div>';
                    setTimeout(()=>document.getElementById('payMsg').innerHTML='',5000);
                }
            };
        }
    }

    async function renderPage(page){
        currentPage=page;
        let html='';
        if(currentUser.role==='admin'){
            if(page==='dashboard')html=renderDashboard();
            else if(page==='readings')html=renderReadings();
            else if(page==='payments')html=renderPayments();
            else if(page==='addpay')html=renderAddPay();
            else if(page==='users')html=renderUsers();
            else if(page==='profile')html=renderProfile();
            else html=renderDashboard();
        }else{
            if(page==='dashboard')html=renderDashboard();
            else if(page==='readings')html=renderReadings();
            else if(page==='payments')html=renderPayments();
            else if(page==='profile')html=renderProfile();
            else html=renderDashboard();
        }
        const r=document.getElementById('app-root');
        if(r)r.innerHTML=html;
        await attach();
        document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    }

    async function go(page){await renderPage(page);history.pushState({page},'','#'+page);}

    async function initMain(){
        document.body.innerHTML=renderNav();
        await go('dashboard');
        document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
        document.getElementById('logoutBtn').addEventListener('click',()=>{currentUser=null;initLogin();});
        window.addEventListener('popstate',e=>{if(e.state?.page&&currentUser)go(e.state.page);});
    }

    async function initLogin(){
        document.body.innerHTML=renderLogin();
        document.getElementById('togglePwd').addEventListener('click',function(){
            const pwd=document.getElementById('loginPassword');
            const btn=document.getElementById('togglePwd');
            if(pwd.type==='password'){pwd.type='text';btn.textContent='🙈 Скрыть';}
            else{pwd.type='password';btn.textContent='👁 Показать';}
        });
        document.getElementById('loginForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const plot=document.getElementById('loginPlot').value.trim();
            const pwd=document.getElementById('loginPassword').value.trim();
            await load();
            const user=members.find(m=>{
                const mPlot=String(m.plot||'').trim();
                const mPwd=String(m.password||'').trim();
                return mPlot===plot&&mPwd===pwd;
            });
            if(user){currentUser={...user,id:parseInt(user.id)||user.id};await initMain();}
            else{const el=document.getElementById('loginError');el.innerHTML='❌ Неверный логин или пароль.';el.style.display='block';}
        });
    }

    initLogin();
</script>
</body>
</html>
